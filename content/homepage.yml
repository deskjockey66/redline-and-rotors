headline: A record of the cars and watches I’ve owned.
intro: I’m Michael, a logistics manager in Brisbane and a former Australian Army soldier.
  I started this journal to keep a record of the cars and watches I’ve owned, including
  the ones I sold.
currently_driving: Gunmetal grey R35 GT-R. I also own a Tesla Model Y.
currently_wearing: The Submariner got most of my wrist time this year.
next_up: My newer Datejust 36 and Cartier Santos will get their own entries.
