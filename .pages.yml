media:
  input: media
  output: /media
  rename: safe
  categories: [image]
content:
  - name: articles
    label: Articles
    type: collection
    path: content/posts
    fields:
      - {name: title, label: Title, type: string, required: true}
      - {name: date, label: Date, type: date, required: true}
      - {name: category, label: Section, type: string}
      - {name: summary, label: Short introduction, type: text}
      - {name: cover, label: Cover photograph, type: image}
      - {name: photo_credit, label: Photographer and licence, type: string}
      - {name: published, label: Publish this article, type: boolean, default: false}
      - {name: body, label: Article, type: rich-text}
  - name: homepage
    label: Homepage
    type: file
    path: content/homepage.yml
    fields:
      - {name: headline, label: Main headline, type: string}
      - {name: intro, label: Introduction, type: text}
      - {name: hero_image, label: Feature photograph, type: image}
      - {name: hero_kicker, label: Feature section label, type: string}
      - {name: hero_title, label: Feature title, type: string}
      - {name: hero_description, label: Feature introduction, type: text}
      - {name: hero_link, label: 'Feature link (stories/article-name/)', type: string}
  - name: about
    label: About the journal
    type: file
    path: content/about.md
    fields:
      - {name: title, type: string}
      - {name: body, type: rich-text}
